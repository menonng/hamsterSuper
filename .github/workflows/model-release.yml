# Turns a pushed `model-*` tag into a GitHub Release.
# The trainer (hamster_super/release/github_release.py, method "actions")
# creates a commit with the model files under release/ and the notes in
# .release-notes.md, tags it and pushes only the tag; this workflow then
# creates the release with the built-in token, so the training machine only
# needs plain `git push` access.
name: Model release

on:
  push:
    tags: ["model-*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          notes=.release-notes.md
          [ -f "$notes" ] || echo "HamsterSuper model ${tag}" > "$notes"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" release/* --title "HamsterSuper ${tag}" \
              --notes-file "$notes" --repo "$GITHUB_REPOSITORY"
          fi
